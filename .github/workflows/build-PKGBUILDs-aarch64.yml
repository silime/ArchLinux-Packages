name: Build Arch Repository

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REPO_NAME: qcom
  BUILD_DIR: build
  REPO_DIR: repo
  CHROMIUM_PACKAGE: chromium-150.0.7871.124-3-aarch64.pkg.tar.xz
  CHROMIUM_PACKAGE_URL: https://github.com/silime/ArchLinux-Packages/releases/download/chromium-150.0.7871.124-3/chromium-150.0.7871.124-3-aarch64.pkg.tar.xz
  CHROMIUM_PACKAGE_SHA256: ab9b71b7cbee5717de67d87214aae6797a16ba3ba3a9cf5faa6c5b65b3efd4cc

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-22.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Select packages
      id: packages
      shell: bash
      run: |
        mapfile -t all_packages < <(
          find . -type f -name PKGBUILD -printf '%h\n' | sed 's#^./##' | sort |
          while read -r package; do
            case "$package" in
              chromium|makepkg-aarch64) ;;
              *) printf '%s\n' "$package" ;;
            esac
          done
        )
        if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
          printf '%s\n' "${all_packages[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))' > packages.json
        else
          mapfile -t changed_files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          changed=()
          for package in "${all_packages[@]}"; do
            for file in "${changed_files[@]}"; do
              if [[ "$file" == "$package"/* ]]; then
                changed+=("$package")
                break
              fi
            done
          done
          printf '%s\n' "${changed[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | unique' > packages.json
        fi
        packages=$(<packages.json)
        echo "Changed packages: ${packages}"
        echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  build-packages:
    name: Build Package (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-22.04-arm
    container: menci/archlinuxarm
    env: 
      BUILD_ALARM_SH: 'sudo su - alarm -c'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    
    steps:

    - name: Install dependencies
      run: | 
        curl -L -o /etc/pacman.conf https://github.com/silime/ArchlinuxARM-qcom-aarch64/raw/main/pacman.conf
        pacman-key --init && pacman-key --populate archlinuxarm
        pacman-key --recv-keys F60FD4C6D426DAB6
        pacman-key --lsign F60FD4C6D426DAB6
        pacman --disable-download-timeout -Syyu --noconfirm --ask=4 arch-install-scripts cloud-guest-utils sudo binutils fakeroot base-devel git cmake gcc bc distcc ccache meson libqmi protobuf-c glib2 curl jq squashfs-tools xxhash unzip libarchive
        useradd -m alarm
        passwd -d alarm
        usermod -aG wheel alarm
        echo 'alarm ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
        mkdir /home/alarm/ -p
        chown alarm /home/alarm/
        
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Import Mesa source signing key
      if: matrix.package == 'mesa'
      run: |
        ${{ env.BUILD_ALARM_SH }} 'gpg --batch \
          --keyserver hkps://keyserver.ubuntu.com \
          --recv-keys 57551DE15B968F6341C248F68D8E31AFC32428A6'

    - name: Build package
      working-directory: ${{ github.workspace }}/${{ matrix.package }}
      run: |
        # 构建参数配置
        export MAKEPKG_CONF="/etc/makepkg.conf"
        sudo sed -i 's|^#\?PACKAGER=.*|PACKAGER="silime <chalkin@yeah.net>"|' /etc/makepkg.conf
        echo 'BUILDENV=(!distcc color !ccache check !sign)' | sudo tee -a $MAKEPKG_CONF
        # 清理并构建
        sudo chown alarm:alarm ./
        echo RELEASE=$(echo ${{ matrix.package }} | sed 's/\//_/g')
        echo RELEASE=$(echo ${{ matrix.package }} | sed 's/\//_/g') >> $GITHUB_ENV

        cp -a ./. /home/alarm/

        # The dependency packages are built in isolated matrix runners. Build
        # and install the local stack first when a package needs a sibling
        # package from this repository.
        build_local_dep() {
          local dep="$1"
          rm -rf "/home/alarm/${dep}"
          cp -a "${GITHUB_WORKSPACE}/${dep}" "/home/alarm/"
          chown -R alarm:alarm "/home/alarm/${dep}"
          ${{ env.BUILD_ALARM_SH }} "(cd /home/alarm/${dep} && makepkg --cleanbuild --nodeps --noconfirm)"
          pacman --disable-sandbox -U --noconfirm "/home/alarm/${dep}"/*.pkg.tar.*
          rm -f "/home/alarm/${dep}"/*.pkg.tar.*
        }

        case "${{ matrix.package }}" in
          fbenv-git)
            build_local_dep bfdev-git
            ;;
          sdbd-git)
            build_local_dep bfdev-git
            build_local_dep fbenv-git
            ;;
        esac

        case "${{ matrix.package }}" in
          fex-rootfs-archlinux|proton-cachyos-arm64|proton-ge-arm64|steam-arm64)
            # These packages only need their declared runtime dependencies after
            # installation. Their build tools were installed explicitly above.
            # Building with --nodeps lets the reusable FEX packages bootstrap
            # before fex-emu and the sibling packages exist in this repository.
            ${{ env.BUILD_ALARM_SH }} '(makepkg --cleanbuild --nodeps --noconfirm)'
            ;;
          *)
            ${{ env.BUILD_ALARM_SH }} '(makepkg --cleanbuild --syncdeps --noconfirm)'
            ;;
        esac

    - name: Pack package artifacts
      run: |
        mkdir -p /tmp/package-artifacts
        find /home/alarm -maxdepth 1 -type f -name '*.pkg.tar.*' \
          -exec cp --target-directory=/tmp/package-artifacts -- {} +
        test -n "$(find /tmp/package-artifacts -maxdepth 1 -type f -print -quit)"
        tar --create --file "/tmp/${{ env.RELEASE }}-packages.tar" \
          --directory /tmp/package-artifacts .

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE }}-pkg 
        path: /tmp/${{ env.RELEASE }}-packages.tar
        compression-level: 0

  create-repository:
    name: Create Repository
    runs-on: ubuntu-22.04-arm
    needs: [changes, build-packages]
    if: needs.changes.outputs.packages != '[]'
    container: menci/archlinuxarm
    env: 
      BUILD_ALARM_SH: 'sudo su - alarm -c'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ${{ env.BUILD_DIR }}

    - name: Setup repository directory
      run: |
        mkdir -p ${{ env.REPO_DIR }}
        # GitHub's job container cannot create pacman's Landlock sandbox.
        # Disable it only inside this already-isolated CI container.
        pacman --disable-sandbox --disable-download-timeout -Syyu --noconfirm --ask=4 arch-install-scripts cloud-guest-utils sudo binutils fakeroot base-devel git bc distcc curl jq
        useradd -m alarm
        passwd -d alarm
        usermod -aG wheel alarm
        echo 'alarm ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
        mkdir /home/alarm/ -p
        chown alarm /home/alarm/
        find "${{ env.BUILD_DIR }}" -type f -name '*-packages.tar' \
          -exec tar --extract --file {} --directory "${{ env.REPO_DIR }}" \;
    - name: Download prebuilt Chromium package
      run: |
        if [[ ! -f "${{ env.REPO_DIR }}/${{ env.CHROMIUM_PACKAGE }}" ]]; then
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${{ env.REPO_DIR }}/${{ env.CHROMIUM_PACKAGE }}" \
            "${{ env.CHROMIUM_PACKAGE_URL }}"
        fi
        echo "${{ env.CHROMIUM_PACKAGE_SHA256 }}  ${{ env.REPO_DIR }}/${{ env.CHROMIUM_PACKAGE }}" \
          | sha256sum --check --strict -
    - name: Download packages from previous release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release_json=$(curl --fail --location --retry 5 --retry-all-errors \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=1")
        mapfile -t package_urls < <(jq -r '.[] | .assets[]? | select(.name | test("\\.pkg\\.tar\\.")) | .browser_download_url' <<< "${release_json}")
        for url in "${package_urls[@]}"; do
          [[ -n "$url" ]] || continue
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            --output "${{ env.REPO_DIR }}/$(basename "$url")" "$url"
        done
        find "${{ env.REPO_DIR }}" -maxdepth 1 -type f \
          \( -name '*.db*' -o -name '*.files*' -o -name '*.sig' \) -delete
    - name: Setup GPG
      run: |
        # Import the GPG private key
        ${{ env.BUILD_ALARM_SH }} 'echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --passphrase "${{ secrets.GPG_PASSPHRASE }}" --pinentry-mode loopback'
        # Configure the GPG agent to use the passphrase
        ${{ env.BUILD_ALARM_SH }} 'echo "default-cache-ttl 18000" > ~/.gnupg/gpg-agent.conf'
        ${{ env.BUILD_ALARM_SH }} 'echo "max-cache-ttl 18000" >> ~/.gnupg/gpg-agent.conf'
        ${{ env.BUILD_ALARM_SH }} 'gpgconf --reload gpg-agent'
    - name: Sign package
      run: |
        cp ${{ env.REPO_DIR }}/* /home/alarm/ -r
        chown -R alarm:alarm /home/alarm/*
        ${{ env.BUILD_ALARM_SH }} '
        for pkg in /home/alarm/*.pkg.tar.*; do
          [[ -f "$pkg" ]] || continue
          echo "Signing $pkg ..."
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase ${{ secrets.GPG_PASSPHRASE }}\
            --detach-sign --no-armor "$pkg"
        done'
    - name: Generate repository database
      run: |
        ${{ env.BUILD_ALARM_SH }} 'repo-add -s -v -n ${{ env.REPO_NAME }}.db.tar.xz *.pkg.tar.xz'

    - name: Pack repository artifact
      run: |
        tar --create --file "/tmp/${{ env.REPO_NAME }}-repository.tar" \
          --directory /home/alarm --exclude='./.*' .

    - name: Upload repository
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.REPO_NAME }}
        path: /tmp/${{ env.REPO_NAME }}-repository.tar
        compression-level: 0
    
    - name: Set variables
      run: |
        echo RELEASE=$(date +%Y\/%m\/%d)-${GITHUB_RUN_NUMBER} >> $GITHUB_ENV
      shell: bash

    - name: create release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body: ${{ env.RELEASE }}
        tag_name: ${{ env.RELEASE }}
        draft: false
        prerelease: false
        files: |
          /home/alarm/*
